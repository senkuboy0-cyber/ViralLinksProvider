name: Build ViralLinksProvider Extension

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            echo "Downloading Gradle wrapper jar..."
            curl -sL "https://github.com/gradle/gradle/raw/v9.6.0-milestone-3/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || \
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v9.6.0-milestone-3/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Generate
        run: |
          ./gradlew ViralLinksProvider:make
          ./gradlew makePluginsJson
          mkdir -p build_output
          cp ViralLinksProvider/build/*.cs3 build_output/ || true
          cp build/plugins.json build_output/plugins.json

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build_output
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
